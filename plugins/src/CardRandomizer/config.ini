# Card Randomizer options (1 = on, 0 = off)
randomize_player=1
randomize_opponent=1
# 1 = keep each deck's mix of monsters / spells / traps (a random monster replaces a monster, etc.); 0 = fully random
keep_balance=0
# maximum copies of the same card in one deck
max_copies=3
# fixed seed (0 = a new random deck every duel)
seed=0
